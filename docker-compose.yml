version: '3.1'
services:
  fulltextrss:
    image: heussd/fivefilters-full-text-rss:latest
    container_name: fulltextrss
    environment:
      - FTR_ADMIN_PASSWORD=
    ports:
      - "8085:80"
    volumes:
      - rss-cache:/var/www/html/cache/rss
    restart: unless-stopped

volumes:
  rss-cache:

server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

scheduler:
  enabled: false

fulltextrss:
  base-url: http://localhost:9999

openai:
  api-key: test-key
  base-url: http://localhost:9998
  model: gpt-4o
  max-tokens: 1000

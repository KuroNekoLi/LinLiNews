server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  url: ${SERVER_URL:}

fulltextrss:
  base-url: ${FULLTEXTRSS_BASE_URL:http://localhost:8085}
  enabled: ${FULLTEXTRSS_ENABLED:true}

spring:
  datasource:
    url: jdbc:sqlite:/data/linli_news.db?foreign_keys=on&busy_timeout=10000
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 60000
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-init-sql: "PRAGMA journal_mode=WAL; PRAGMA synchronous=NORMAL;"
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
        format_sql: false
        use_sql_comments: false
        javax.persistence.validation.mode: none

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 9
    out-of-order: true
    validate-on-migrate: false
    clean-disabled: true
  
  jackson:
    deserialization:
      fail-on-unknown-properties: false

# 任務排程設定
scheduler:
  enabled: ${SCHEDULER_ENABLED:true}

openai:
  api-key: ${OPENAI_API_KEY:}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
  model: ${OPENAI_MODEL:gpt-4o}
  max-tokens: ${OPENAI_MAX_TOKENS:16000}
  explanation-fallback-enabled: ${OPENAI_EXPLANATION_FALLBACK_ENABLED:true}
server:
  port: ${PORT:8080}
  # 支援反向代理標頭（Zeabur、Nginx 等會自動設定 X-Forwarded-* 標頭）
  # 這讓 Swagger 能自動偵測正確的生產環境 URL
  forward-headers-strategy: framework
  # Swagger 伺服器 URL（生產環境請設定為實際網址，例如：https://your-domain.zeabur.app）（選填）
  url: ${SERVER_URL:}

fulltextrss:
  base-url: ${FULLTEXTRSS_BASE_URL:http://localhost:8085}
  enabled: ${FULLTEXTRSS_ENABLED:true}

spring:
  datasource:
    url: jdbc:sqlite:./linli_news.db?busy_timeout=10000
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 2
      minimum-idle: 1
      connection-init-sql: "PRAGMA journal_mode=WAL; PRAGMA synchronous=NORMAL;"
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
  jackson:
    deserialization:
      fail-on-unknown-properties: false

org:
  jobrunr:
    job-scheduler:
      enabled: ${JOBRUNR_SCHEDULER_ENABLED:true}
    background-job-server:
      enabled: ${JOBRUNR_BACKGROUND_ENABLED:true}
    dashboard:
      enabled: ${JOBRUNR_DASHBOARD_ENABLED:false}
      port: ${JOBRUNR_DASHBOARD_PORT:8001}

openai:
  api-key: ${OPENAI_API_KEY:}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
  model: ${OPENAI_MODEL:gpt-4o}
  max-tokens: ${OPENAI_MAX_TOKENS:16000}
  explanation-fallback-enabled: ${OPENAI_EXPLANATION_FALLBACK_ENABLED:true}

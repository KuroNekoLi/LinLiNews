server:
  port: 8080

fulltextrss:
  base-url: http://localhost:8085

spring:
  datasource:
    url: jdbc:mysql://localhost:3307/linli_news?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: root
    password: rootpwd
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  jackson:
    deserialization:
      fail-on-unknown-properties: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

org:
  jobrunr:
    job-scheduler:
      enabled: true
    background-job-server:
      enabled: true
    dashboard:
      enabled: true
      port: 8001
